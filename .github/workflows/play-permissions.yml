name: Play Console Permission Check

on:
  push:
    branches: [android-release]
    paths:
      - .github/workflows/play-permissions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify Play Internal Testing access
    runs-on: ubuntu-24.04
    steps:
      - id: auth
        name: Authenticate service account
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Create and abandon an empty Play edit
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          PACKAGE_NAME: com.arm8tron.t3code
        run: |
          ACCESS_TOKEN=$(gcloud auth application-default print-access-token \
            --scopes=https://www.googleapis.com/auth/androidpublisher)
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")
          if [[ "$status" != 2* ]]; then
            echo "Play Developer API request failed (HTTP $status):"
            cat "$response_file"
            exit 1
          fi
          edit=$(<"$response_file")
          edit_id=$(jq --raw-output '.id' <<< "$edit")
          trap 'curl --fail-with-body --silent --show-error --request DELETE --header "Authorization: Bearer $ACCESS_TOKEN" "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id"' EXIT
          test -n "$edit_id"
          echo "Service account can create Play edits for $PACKAGE_NAME."
