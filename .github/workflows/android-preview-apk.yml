name: Android Preview APK

on:
  push:
    branches: [android-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_VARIANT: preview
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Generate Android project
        run: pnpm --filter @t3tools/mobile exec expo prebuild --clean --platform android

      - name: Build preview APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease --no-daemon --no-parallel -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: t3-code-preview-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
